name: autoyoutube
description: AutoYouTube - AI producer for your YouTube channel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  file_picker: ^10.0.0
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  http: ^1.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/AutoYouTube.html

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: '#07070A'
  adaptive_icon_foreground: assets/icon_fg.png
