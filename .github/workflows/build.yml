name: Build AutoYouTube APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org com.wersfad --project-name autoyoutube .

      - name: Internet permission and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.INTERNET' $M || sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' $M
          sed -i 's/android:label="[^"]*"/android:label="AutoYouTube"/' $M
          cat $M

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: AutoYouTube-apk
          path: build/app/outputs/flutter-apk/app-release.apk
